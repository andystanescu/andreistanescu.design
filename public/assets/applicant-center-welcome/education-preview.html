(target) target.scrollIntoView({ block: \"nearest\", behavior: \"smooth\" });\n    });\n    return () => window.cancelAnimationFrame(frame);\n  }, [keyboardVisible, keyboardMounted, keyboardField, cue]);\n  const takeControl = () => { setAutoplay(false); setCue(\"\"); };\n  React.useEffect(() => {\n    if (!cue) return;\n    const target = document.querySelector('.edu-demo [data-demo-cue=\"' + cue + '\"]');\n    if (target) target.scrollIntoView({ block: \"nearest\", behavior: \"smooth\" });\n  }, [cue]);\n  React.useEffect(() => {\n    if (!autoplay || (window.matchMedia && window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches)) return;\n    const timers = [];\n    const schedule = (delay, action) => timers.push(window.setTimeout(action, delay));\n    const typeText = (start, key, value) => {\n      schedule(start, () => setCue(key));\n      for (let index = 1; index <= value.length; index++) {\n        schedule(start + index * 75, () => setData(previous => ({ ...previous, [key]: value.slice(0, index) })));\n      }\n    };\n    const empty = { school: \"\", country: \"\", state: \"\", city: \"\", field: \"\", degree: \"\", name: \"\", start: \"\", end: \"\" };\n    for (let cycle = 0; cycle < 3; cycle++) {\n      const start = cycle * 29000;\n      schedule(start, () => { hasOpenedForm.current = false; setScreen(\"list\"); setStep(1); setCreated(false); setShowWarning(false); setCue(\"\"); setData(empty); });\n      schedule(start + 3000, () => setCue(\"add\"));\n      schedule(start + 4300, () => { hasOpenedForm.current = true; setCue(\"\"); setScreen(\"form\"); });\n      typeText(start + 5600, \"school\", \"Stanford University\");\n      schedule(start + 7600, () => setCue(\"country\"));\n      schedule(start + 8500, () => setData(previous => ({ ...previous, country: \"United States\" })));\n      typeText(start + 9700, \"city\", \"Stanford\");\n      schedule(start + 11500, () => setCue(\"\"));\n      schedule(start + 11850, () => { setCreated(true); setScreen(\"list\"); });\n      schedule(start + 13300, () => setCue(\"next\"));\n      schedule(start + 14600, () => { setCue(\"\"); setShowWarning(true); });\n      schedule(start + 17200, () => setCue(\"card\"));\n      schedule(start + 18500, () => { setCue(\"\"); setShowWarning(false); setStep(1); setScreen(\"form\"); });\n      typeText(start + 20500, \"field\", \"Computer science\");\n      schedule(start + 22900, () => setCue(\"\"));\n    }\n    return () => timers.forEach(window.clearTimeout);\n  }, [autoplay]);\n  const update = (key, value) => setData((previous) => ({ ...previous, [key]: value }));\n  const incomplete = !data.school || !data.country || !data.city || !data.field || !data.degree || !data.name || !data.start || !data.end;\n  const leaveForm = () => { setKeyboardField(\"\"); setCreated(true); setScreen(\"list\"); setStep(1); };\n  const openForm = () => { hasOpenedForm.current = true; setShowWarning(false); setStep(1); setScreen(\"form\"); };\n  const input = (key, label, placeholder = \"\") => <label className=\"edu-field\"><span>{label}</span><input data-demo-cue={key} className={cue === key ? \"edu-cued\" : \"\"} value={data[key]} placeholder={placeholder} onFocus={() => setKeyboardField(key)} onBlur={() => setKeyboardField(\"\")} onChange={(event) => update(key, event.target.value)} /></label>;\n  const select = (key, label, placeholder, options) => <label className=\"edu-field\"><span>{label}</span><select data-demo-cue={key} className={cue === key ? \"edu-cued\" : \"\"} value={data[key]} onChange={(event) => update(key, event.target.value)}><option value=\"\">{placeholder}</option>{options.map((option) => <option key={option} value={option}>{option}</option>)}</select></label>;\n  return <div className=\"edu-scene\"><div className=\"edu-screen\"><div className={\"edu-demo\" + (screen === \"list\" && !hasOpenedForm.current ? \" edu-opening\" : \"\")} onPointerDown={takeControl} onKeyDown={takeControl}>\n    <style>{`\n      .edu-demo{fo
